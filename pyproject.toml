[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfa-anchoring"
version = "0.1.0"
description = "Layerwise Function Anchoring: preserve sub-module functions on sampled hidden states while fine-tuning an LLM"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "transformers>=4.45", "peft>=0.13", "numpy>=1.24", "pyyaml>=6", "tqdm>=4.65", "datasets>=2.18", "requests>=2.31"]

[project.optional-dependencies]
pdf = ["marker-pdf"]
html = ["beautifulsoup4", "markdownify"]
sklearn = ["scikit-learn>=1.3"]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
lfa = "lfa.cli:main"

[tool.setuptools.packages.find]
include = ["lfa*"]

[tool.pytest.ini_options]
markers = ["gpu: needs CUDA", "equivalence: needs the research code checkout", "acceptance: ~1 GPU-hour on the Chalmers corpus"]
addopts = "-m 'not gpu and not equivalence and not acceptance'"
testpaths = ["tests"]
