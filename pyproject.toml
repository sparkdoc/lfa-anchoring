[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfa-anchoring"
version = "0.1.0"
description = "Layerwise Function Anchoring: preserve sub-module functions on sampled hidden states while fine-tuning an LLM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# `transformers>=4.56`: `lfa/models.py` loads with `dtype=`, the post-rename spelling of
# `torch_dtype=` (4.57 still warns for the old one). On an older transformers `dtype` is
# neither a `from_pretrained` parameter nor a config field, so it survives as an unused
# kwarg and the model loads in the checkpoint's own dtype -- silently, which for a method
# whose signal is a function-output MSE is worse than a failure. `accelerate` is likewise
# not optional: every load passes `device_map=`, which transformers refuses without it.
dependencies = ["torch>=2.2", "transformers>=4.56,<5", "accelerate>=0.26", "peft>=0.18,<1", "numpy>=1.24", "pyyaml>=6", "tqdm>=4.65", "datasets>=2.18", "requests>=2.31"]

[project.optional-dependencies]
pdf = ["marker-pdf"]
html = ["beautifulsoup4", "markdownify"]
sklearn = ["scikit-learn>=1.3"]
dev = ["pytest>=8", "pytest-cov", "build"]

[project.scripts]
lfa = "lfa.cli:main"

# `sparkdoc` is the same placeholder `lfa/artifact/fetch.py::_RELEASE_BASE` carries, and RELEASING.md
# step 4 fills all of them in one edit. Declared at all because the README is the PyPI long
# description: without these a visitor there has no pointer to where the documentation lives.
[project.urls]
Homepage = "https://github.com/sparkdoc/lfa-anchoring"
Repository = "https://github.com/sparkdoc/lfa-anchoring"
Documentation = "https://github.com/sparkdoc/lfa-anchoring/blob/main/docs/quickstart.md"
Changelog = "https://github.com/sparkdoc/lfa-anchoring/releases"

# `lfa.examples` is the top-level `examples/` directory, installed inside the package. The docs
# send a reader to those two scripts as the way in, and a wheel that ships neither them nor the
# docs they link to leaves a pip-installed user with nothing to run. Mapped rather than moved so
# that the repository keeps `examples/` where every document already points.
[tool.setuptools]
packages = ["lfa", "lfa.adapters", "lfa.artifact", "lfa.examples"]

[tool.setuptools.package-dir]
"lfa.examples" = "examples"

[tool.setuptools.package-data]
lfa = ["recipes/*.yaml"]
"lfa.examples" = ["*.yaml"]

[tool.pytest.ini_options]
markers = ["gpu: needs CUDA", "equivalence: needs a checkout of the research code", "acceptance: ~1 GPU-hour on the Chalmers corpus", "slow: downloads data from the Hugging Face Hub", "release: the end state of RELEASING.md (fails until the release steps are done)"]
addopts = "-m 'not gpu and not equivalence and not acceptance and not slow and not release'"
# `error` first, so a warning this package starts emitting fails the suite instead of joining a
# pile of noise. The two exemptions below are torch's own, not ours: `lfa.corpus.make_dataloader`
# pins memory when CUDA is available (a real throughput feature), and torch 2.10's pin path calls
# `Tensor.pin_memory(device)` / `Tensor.is_pinned(device)` with the device argument it has itself
# deprecated -- three tensors per batch, ~18k lines over a GPU-machine suite run, and nothing this
# package can do about it. They are matched by message so that any OTHER deprecation still errors.
filterwarnings = [
    "error",
    "ignore:The argument 'device' of Tensor.pin_memory\\(\\) is deprecated:DeprecationWarning",
    "ignore:The argument 'device' of Tensor.is_pinned\\(\\) is deprecated:DeprecationWarning",
]
testpaths = ["tests"]
