[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfa-anchoring"
version = "0.2.0"
description = "Layerwise Function Anchoring: preserve sub-module functions on sampled hidden states while fine-tuning an LLM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# `transformers>=4.56`: `lfa/models.py` loads with `dtype=`, the post-rename spelling of
# `torch_dtype=` (4.57 still warns for the old one). On an older transformers `dtype` is
# neither a `from_pretrained` parameter nor a config field, so it survives as an unused
# kwarg and the model loads in the checkpoint's own dtype -- silently, which for a method
# whose signal is a function-output MSE is worse than a failure. `accelerate` is likewise
# not optional: every load passes `device_map=`, which transformers refuses without it.
dependencies = ["torch>=2.2", "transformers>=4.56,<5", "accelerate>=0.26", "peft>=0.18,<1", "numpy>=1.24", "pyyaml>=6", "tqdm>=4.65", "datasets>=2.18"]

[project.optional-dependencies]
pdf = ["marker-pdf"]
html = ["beautifulsoup4", "markdownify"]
sklearn = ["scikit-learn>=1.3"]
# nbformat/nbclient/ipykernel are what `tests/test_notebook.py` reads and runs
# `examples/two_domain_walkthrough.ipynb` and `examples/what_the_anchor_does.ipynb`
# with; a user who only wants the library needs none of them.
dev = ["pytest>=8", "pytest-cov", "build", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.29"]

[project.scripts]
lfa = "lfa.cli:main"

# Declared because the README is the PyPI long description: these links point a visitor on the
# PyPI page at the repository and at its documentation.
[project.urls]
Homepage = "https://github.com/sparkdoc/lfa-anchoring"
Repository = "https://github.com/sparkdoc/lfa-anchoring"
Documentation = "https://github.com/sparkdoc/lfa-anchoring/blob/main/docs/quickstart.md"
Changelog = "https://github.com/sparkdoc/lfa-anchoring/releases"

# `lfa.examples` is the top-level `examples/` directory, installed inside the package. The docs
# send a reader to those two scripts as the way in, and a wheel that ships neither them nor the
# docs they link to leaves a pip-installed user with nothing to run. Mapped rather than moved so
# that the repository keeps `examples/` where every document already points.
[tool.setuptools]
packages = ["lfa", "lfa.adapters", "lfa.artifact", "lfa.selfgen", "lfa.examples"]

[tool.setuptools.package-dir]
"lfa.examples" = "examples"

[tool.setuptools.package-data]
lfa = ["recipes/*.yaml"]
"lfa.examples" = ["*.yaml", "*.ipynb"]

[tool.pytest.ini_options]
markers = ["gpu: needs CUDA", "slow: downloads data from the Hugging Face Hub", "notebook: executes the example notebooks end to end (a GPU, the network, ~19 minutes on an RTX 3090 for the walkthrough and about as much again for its companion)"]
addopts = "-m 'not gpu and not slow and not notebook'"
# `error` first, so a warning this package starts emitting fails the suite instead of joining a
# pile of noise. Left at that, the rule is brittle in a way that has nothing to do with this
# package: `error` applies to every warning raised anywhere in the process, so a deprecation that
# a third-party library emits at import time -- torch and deepspeed under Python 3.14, say, the
# latter pulled in by `accelerate` when it happens to be installed -- fails the suite on one
# machine and not another. The three exemptions below narrow the rule without weakening it where
# it matters. Deprecation-class warnings (`DeprecationWarning`, `PendingDeprecationWarning`,
# `FutureWarning`) are ignored ONLY when they are attributed to a module outside `lfa` and
# `tests`: a deprecated call made by this package's own code is still attributed to it (that is
# what `stacklevel` is for) and still errors, and every other category -- `UserWarning`,
# `RuntimeWarning` -- still errors wherever it comes from. These subsume torch 2.10's
# `Tensor.pin_memory(device)` / `Tensor.is_pinned(device)` deprecations, which the previous list
# exempted by message. The last entry is torch's own report that the NVIDIA driver could not be
# reached (a container, a sandbox, a machine whose GPU is unplugged): the suite needs no GPU, so
# a missing one is not a test failure.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:(?!lfa(\\.|$)|tests(\\.|$)).*",
    "ignore::PendingDeprecationWarning:(?!lfa(\\.|$)|tests(\\.|$)).*",
    "ignore::FutureWarning:(?!lfa(\\.|$)|tests(\\.|$)).*",
    "ignore:Can't initialize NVML:UserWarning",
]
testpaths = ["tests"]
