[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfa-anchoring"
version = "0.1.0"
description = "Layerwise Function Anchoring: preserve sub-module functions on sampled hidden states while fine-tuning an LLM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "transformers>=4.45,<5", "peft>=0.18,<1", "numpy>=1.24", "pyyaml>=6", "tqdm>=4.65", "datasets>=2.18", "requests>=2.31"]

[project.optional-dependencies]
pdf = ["marker-pdf"]
html = ["beautifulsoup4", "markdownify"]
sklearn = ["scikit-learn>=1.3"]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
lfa = "lfa.cli:main"

[tool.setuptools.packages.find]
include = ["lfa*"]

[tool.setuptools.package-data]
lfa = ["recipes/*.yaml"]

[tool.pytest.ini_options]
markers = ["gpu: needs CUDA", "equivalence: needs the research code checkout", "acceptance: ~1 GPU-hour on the Chalmers corpus", "slow: downloads data from the Hugging Face Hub"]
addopts = "-m 'not gpu and not equivalence and not acceptance and not slow'"
# `error` first, so a warning this package starts emitting fails the suite instead of joining a
# pile of noise. The two exemptions below are torch's own, not ours: `lfa.corpus.make_dataloader`
# pins memory when CUDA is available (a real throughput feature), and torch 2.10's pin path calls
# `Tensor.pin_memory(device)` / `Tensor.is_pinned(device)` with the device argument it has itself
# deprecated -- three tensors per batch, ~18k lines over a GPU-machine suite run, and nothing this
# package can do about it. They are matched by message so that any OTHER deprecation still errors.
filterwarnings = [
    "error",
    "ignore:The argument 'device' of Tensor.pin_memory\\(\\) is deprecated:DeprecationWarning",
    "ignore:The argument 'device' of Tensor.is_pinned\\(\\) is deprecated:DeprecationWarning",
]
testpaths = ["tests"]
