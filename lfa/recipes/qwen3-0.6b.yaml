# The Layerwise Function Anchoring (LFA) operating point for Qwen3-0.6B.
#
# What this is: rank-32 LoRA (alpha 64, embedding and LM head frozen) over a p(h) artifact fitted
# on the model's own text (see `self_generated_frame` below), anchored at lambda = 160,000 on
# both site families with mu = 0.05 as the uniform weight backstop, n = 16 anchor samples per step,
# the anchor's layer schedule decaying to 0.1 of layer 0 on a cosine. Adam at 3e-4, batch 6 x 512
# tokens, 50 warmup steps then cosine decay to zero over the epochs trained. Fifteen epochs
# over the walkthrough's Darwin text (about 189 k tokens) took about 19.5 minutes of training on one
# 24 GB card (this release's frame, the supplement already written).
#
# How lambda was chosen (Qwen3-0.6B; its self-generated artifact at the recorded frame; the
# Darwin text of the two-domain walkthrough, about 189 k training tokens an epoch, with the
# model's own two-pass question-and-answer supplement at 0.13, its pairs shuffled under seed 42;
# the cosine laid over the run's real step count; one seed; perplexity; RTX 3090; 2026-10-08).
# Each rung was kept at its own dose (docs/tuning.md §4): a 15-epoch run, then a re-run at the
# epoch its validation curve turned at (2.5M never turned). Scored on WikiText-2 (100 windows,
# 51,200 tokens) and on held-out Darwin (26,147 tokens); base 17.93 and 30.12:
#
#   lambda (epochs kept)  64k (4) / 160k (4) / 400k (7) / 1M (10) / 2.5M (15)
#   WikiText-2            16.40   / 16.15    / 16.28    / 16.40   / 16.49
#   held-out Darwin       16.81   / 17.29    / 17.94    / 18.39   / 18.87
#   unanchored control (lambda = mu = 0) at 4 epochs: 25.63 / 18.39; at 15 epochs 302.49 / 194.07.
#
# The control at 4 epochs improves the domain, so the selection is the first rule of
# docs/model-integration-cookbook.md §5: the rungs whose held-out Darwin gain is at least 90 % of
# the control's (held-out Darwin at most 19.57: every rung), then the lowest WikiText-2, ties
# within 1 % to the smaller lambda. That is 160,000 (16.15; 400k's 16.28 is within 1 % and
# larger), with a rung on either side: an interior pick. A behaviour reading (the shift in the
# base model's own answers to 40 general prompts, docs/tuning.md §4) ties 160k with 400k: +0.121
# nats at 160k, +0.120 at 400k, +0.154 at 64k, against +0.565 for the 4-epoch control. One seed,
# one corpus.
#
# The dose at this lambda. The 15-epoch run's per-epoch validation perplexity (the training
# split's own 10 %) was lowest at epoch 4 (16.97) and ended at 30.54, 80.0 % above it, and the run
# ended worse than the base model on both axes (WikiText-2 18.76, held-out Darwin 30.93); the
# re-run at --epochs 4 ended at its own lowest and scored 16.15 and 17.29. `epochs` stays 15: the
# run ends with a line naming the epoch its curve turned at, and a re-run at that epoch is the run
# to ship (docs/tuning.md §2). At lambda = 1,000,000 the same text turned at epoch 10. One seed,
# one corpus: on your own corpus, read the run's last line.
#
# The stage-2 multiplier. A two-stage chain (Darwin at 4 epochs, `extend`, then the walkthrough's
# cookery text for the recipe's 15 epochs) at lambda = 160,000: 3x beat 1x on cookery (held-out
# 23.09 -> 19.73 against 23.16 -> 30.16), on Darwin retention (17.33 -> 23.54 against 17.30 ->
# 33.70) and on WikiText-2 (100 windows, 16.12 -> 17.33 against 16.13 -> 18.94). Both arms
# over-trained cookery at 15 epochs. Re-run at their own turns (1x at 5 epochs, 3x at 8) they came
# out close: cookery 14.18 against 15.11, Darwin 19.79 against 19.70, WikiText-2 16.46 against
# 16.44; by the cookbook's multiplier rule 1x edges it there (3x's cookery gain is 88.9 % of 1x's,
# against a 90 % bar), and 3x's re-run itself turned at epoch 6. One seed, one pair of domains,
# perplexity. docs/recipes.md has the tables.
#
# The paper's operating point is a different one: lambda = 100,000, calibrated in the research
# code on a corpus about ten times larger (about 1,700 documents, ~1.8 M training tokens), first
# against an artifact fitted on real text. It is the paper's point, and not this recipe's.
#
# This is a JOINT point: the values were tuned together, and lambda in particular does not travel
# on its own. It is coupled to three things:
#
#   * LoRA RANK. Lambda constrains motion inside the rank-r update subspace, so the same value
#     binds far harder at a lower rank. Lower rank => lower lambda: on the research corpus, at
#     the paper's point, rank 16's frontier sat at roughly a fifth to a half of rank 32's lambda.
#     This recipe was measured at rank 32 only. Re-tune rather than port, and diagnose against
#     held-out DOMAIN perplexity -- over-anchoring makes general-text perplexity look its best
#     while domain quality collapses.
#   * The p(h) ARTIFACT. `calibrated_artifact` below records what these lambdas are priced
#     against: this model's self-generated artifact at `self_generated_frame`. Any other artifact
#     is a re-tune.
#   * The CORPUS COMPOSITION. A corpus with a different share of chat-formatted Q&A, or of short
#     documents, or a much larger one, is a different regularization problem; re-tune there too.
#
# Full-weight training (`full_weight: true`) is outside the validated envelope: every measurement
# behind this point is LoRA. If you go there, calibrate lambda and check held-out domain
# perplexity. The research code's starting range for full weight, on the research corpus at
# the paper's point, was 50,000-100,000; it is not a measurement on this recipe's corpus.

name: qwen3-0.6b
model_id: Qwen/Qwen3-0.6B
artifact: self-generated

# -- adapter
lora_rank: 32
lora_alpha: 64
freeze_embed: true
full_weight: false

# -- anchoring: lambda (function anchor) and mu (the uniform weight backstop)
lambda_qkv: 160000.0
lambda_mlp: 160000.0
mu: 0.05
anchor_end_ratio: 0.1
anchor_schedule: cosine
n_anchor_samples: 16

# -- run length and checkpointing
# 15 epochs is the run that finds the dose: it ends with the held-out curve's verdict, and when the
# curve turned earlier (epoch 4 on the walkthrough's Darwin text at this lambda) a re-run with
# `--epochs <that epoch>` is the one to keep
epochs: 15
# rolling: `latest_model` plus `training_state.pt` every 5 epochs, so an interrupted run can be
# resumed rather than restarted. `final_model` is what ships either way.
checkpoint_mode: rolling
checkpoint_every: 5

# -- optimization
learning_rate: 3.0e-4
# warmup then cosine decay to zero over the epochs actually trained (`constant` holds the peak)
lr_schedule: cosine
batch_size: 6
gradient_accumulation_steps: 1
warmup_steps: 50
weight_decay: 0.01
sequence_length: 512
seed: 42
# keep_short_whole is a choice about short documents, not a tuning knob: with `true` a document
# that fits in one chunk is trained WHOLE in every epoch, and with `false` it is cut at the epoch's
# chunk offset like a longer one -- into a chunk and a fragment that starts mid-sentence. Prefer
# `false` only when the documents are themselves arbitrary slices of something longer, so that
# keeping them whole preserves nothing and the positional variety is worth having.
keep_short_whole: true
# a tenth of the documents are held out and scored after every epoch, so the domain number is a
# measurement rather than a fit
val_fraction: 0.1

# -- later stages of a chain: lambda x 3 from stage 2 on, measured on one pair of domains at this
# lambda (above: ahead of 1x on all three axes at the recipe dose); for YOUR pair of domains it is
# where to begin re-tuning, judged on the same two axes.
stage2_lambda_multiplier: 3.0

# -- what this point was calibrated at (the couplings above are checked against these)
calibrated_rank: 32
calibrated_artifact: self-generated
# the frame the self-generated calibration was measured at; `lfa init --artifact
# self-generated` builds at exactly this by default, and a build at any other frame is told so
self_generated_frame:
  n_raw: 2500
  n_chat: 0
  max_new_tokens: 2048
  max_samples: 600000
  gmm_k: 32
  pca_variance: 0.95

# -- the question-and-answer supplement the stage's entry model writes from the domain is mixed in
#    at this share of training tokens, the frame lambda was tuned at
supplement_fraction: 0.13
