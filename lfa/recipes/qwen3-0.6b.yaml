# The Layerwise Function Anchoring (LFA) operating point for Qwen3-0.6B.
#
# What this is: rank-32 LoRA (alpha 64, embedding and LM head frozen) over the int8 `gmm1543k`
# p(h) artifact, anchored at lambda = 100,000 on both site families with mu = 0.05 as the uniform
# weight backstop, n = 16 anchor samples per step, the anchor's layer schedule decaying to 0.1 of
# layer 0 on a cosine. Adam at 3e-4, batch 6 x 512 tokens, 50 warmup steps then cosine decay to
# zero over the fifteen epochs trained. It adapts a 0.6B model to a book-sized corpus in about an
# hour and a half on one 24 GB card.
#
# This is a JOINT point: the values were tuned together, and lambda in particular does not travel
# on its own. It is coupled to three things:
#
#   * LoRA RANK. Lambda constrains motion inside the rank-r update subspace, so the same value
#     binds far harder at a lower rank. Lower rank => lower lambda: at rank 16 the measured
#     frontier on a corpus like this sits at roughly 2e4-5e4, not 1e5. Re-tune rather than port,
#     and diagnose against held-out DOMAIN perplexity -- over-anchoring makes general-text
#     perplexity look its best while domain quality collapses.
#   * The p(h) ARTIFACT. `calibrated_artifact` below records what these lambdas were priced
#     against; a sharper or flatter p(h) changes the anchor's scale, so an artifact swap is a
#     re-tune.
#   * The CORPUS COMPOSITION. A corpus with a different share of chat-formatted Q&A, or of short
#     documents, is a different regularization problem; re-tune there too.
#
# Full-weight training (`full_weight: true`) is outside the validated envelope: every LFA result
# behind this point is LoRA. If you go there, calibrate lambda in 50,000-100,000 and check
# held-out domain perplexity.

name: qwen3-0.6b
model_id: Qwen/Qwen3-0.6B
artifact: qwen3-0.6b-gmm1543k-int8

# -- adapter
lora_rank: 32
lora_alpha: 64
freeze_embed: true
full_weight: false

# -- anchoring: lambda (function anchor) and mu (the uniform weight backstop)
lambda_qkv: 100000.0
lambda_mlp: 100000.0
mu: 0.05
anchor_end_ratio: 0.1
anchor_schedule: cosine
n_anchor_samples: 16

# -- run length and checkpointing
epochs: 15
# rolling: `latest_model` plus `training_state.pt` every 5 epochs, so an interrupted run can be
# resumed rather than restarted. `final_model` is what ships either way.
checkpoint_mode: rolling
checkpoint_every: 5

# -- optimization
learning_rate: 3.0e-4
# warmup then cosine decay to zero over the epochs actually trained (`constant` holds the peak)
lr_schedule: cosine
batch_size: 6
gradient_accumulation_steps: 1
warmup_steps: 50
weight_decay: 0.01
sequence_length: 512
seed: 42
# keep_short_whole is a choice about short documents, not a tuning knob: with `true` a document
# that fits in one chunk is trained WHOLE in every epoch, and with `false` it is cut at the epoch's
# chunk offset like a longer one -- into a chunk and a fragment that starts mid-sentence. Prefer
# `false` only when the documents are themselves arbitrary slices of something longer, so that
# keeping them whole preserves nothing and the positional variety is worth having.
keep_short_whole: true
# a tenth of the documents are held out and scored after every epoch, so the domain number is a
# measurement rather than a fit
val_fraction: 0.1

# -- later stages of a chain. A starting default, not a calibrated constant: stage 2 anchors a
# model that already carries a domain, and 3x lambda is where to begin re-tuning for YOUR pair of
# domains, judged on the same two axes.
stage2_lambda_multiplier: 3.0

# -- what this point was calibrated at (the couplings above are checked against these)
calibrated_rank: 32
calibrated_artifact: qwen3-0.6b-gmm1543k-int8

# -- self-generation (C12: one model, one seed). An artifact fitted on this model's own text tied
#    the gmm1543k artifact at every lambda tried, so it is a calibrated substitute here; the
#    supplement the entry model writes is mixed in at the fraction the lambda was tuned at.
calibrated_self_generated: true
supplement_fraction: 0.13
